# 局域网多用户部署:局域网内设备直接访问 http://<本机IP>:8080。
# 明文 HTTP——请在可信内网使用;对外服务请加 TLS 反向代理(见 README 部署形态)。
- insert:
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 0.0.0.0
        port: 8080
        compression: none
    - id: multi-user-gateway
      name: 'dhx-gateway'
      config:
        # 启动每个用户上游的命令:正式安装用 ['dsh', 'web'];
        # 从 deepseek-harness 检出以源码方式运行时用 scripts/dsh-web-upstream.sh。
        dshCommand: ['dsh', 'web']
        # publicOrigin 仅在自动推导不可能正确时才需要(HTTPS 反代/域名/Docker/WSL 映射)。
        # 直连形态(局域网 IP、回环)无需配置:管理台链接按请求 Host、
        # 引导邀请按本机网卡枚举自动生成。
        # publicOrigin: 'http://192.168.10.19:8080'
        startTimeoutMs: 60000
